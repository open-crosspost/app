name: Deploy

# Thin wrapper — the shared implementation is vendored locally at
# .github/workflows/consumer-deploy.yml (pinned to platform v2.0.0-rc.27).
# Vendoring is required because `secrets: inherit` cannot cross GitHub
# organizations, and this repo calls NEARBuilders' shared workflows from the
# open-crosspost org. The child's framework surface is pinned via `platform`
# (ADR 0034) and moves exclusively through `bos upgrade`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false
      storage_origin:
        description: 'Upload service origin (default: vars.BOS_STORAGE_ORIGIN or the shared service)'
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/consumer-deploy.yml
    with:
      working_directory: .
      verbose: ${{ inputs.verbose == true }}
      storage_origin: ${{ inputs.storage_origin || vars.BOS_STORAGE_ORIGIN || 'https://upload.everything.dev' }}
    secrets: inherit
